<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Runner - Sign in</title><link rel="stylesheet" href="/login.css"></head>
<body><form id="f" class="card" autocomplete="on">
<h1>🔒 Android Runner</h1>
<input type="text" name="username" value="runner" autocomplete="username" hidden>
<label for="pw">Password</label>
<input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
<button type="submit">Sign in</button>
<p id="err" role="alert"></p>
</form><script src="/login.js"></script></body></html>
