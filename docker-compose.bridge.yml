# Optional override for bridge networking (e.g. Coolify's Traefik routes to the container by label):
#   docker compose -f docker-compose.yml -f docker-compose.bridge.yml up -d --build
# Requirements:
#   * 9router / hermes-agent must ALSO listen on the docker bridge gateway (e.g. 172.17.0.1), because
#     a container cannot reach the host's 127.0.0.1. They remain unreachable from the internet.
#   * adb to the phone works through host routing/NAT; verify with `adb connect <tunnel_ip>:5555`.
services:
  runner:
    network_mode: !reset null
    ports:
      - "127.0.0.1:${PORT:-3080}:${PORT:-3080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      NINE_ROUTER_URL: ${NINE_ROUTER_URL:-http://host.docker.internal:20128/v1}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-http://host.docker.internal:8644/webhook}
