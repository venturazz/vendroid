# Android Remote Runner - Docker Compose / Coolify (OCI Ampere linux/arm64).
#
# network_mode: host (default) is what makes BOTH of these work without extra plumbing:
#   * 9router (127.0.0.1:20128) and hermes-agent (127.0.0.1:8644) stay loopback-only on the host
#   * adb reaches the phone via the host's ZeroTier / WireGuard interface and routes
# See docs/RUNBOOK.md for the bridge-mode alternative (docker-compose.bridge.yml).
name: android-remote-runner

services:
  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile.arm64
      args:
        JDK_PACKAGE: ${JDK_PACKAGE:-openjdk-17-jdk-headless}
        INSTALL_BOX64: ${INSTALL_BOX64:-false}
    platform: linux/arm64
    image: android-remote-runner:local
    restart: unless-stopped
    init: true
    network_mode: host
    stop_grace_period: 30s
    mem_limit: ${RUNNER_MEM_LIMIT:-20g}
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: ${PORT:-3080}
      HOST: ${RUNNER_BIND_HOST:-0.0.0.0}   # 127.0.0.1 if a host-level Caddy/Nginx proxies to it
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      API_TOKEN: ${API_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      ANDROID_PROJECT_PATH: /workspace/android-project   # fixed: lives on the `project` volume
      APP_MODULE: ${APP_MODULE:-app}
      DEFAULT_PACKAGE_NAME: ${DEFAULT_PACKAGE_NAME:-}
      DEFAULT_DEVICE_ADDRESS: ${DEFAULT_DEVICE_ADDRESS:-}
      PROJECT_GIT_URL: ${PROJECT_GIT_URL:-}
      PROJECT_GIT_BRANCH: ${PROJECT_GIT_BRANCH:-main}
      SDK_PACKAGES: ${SDK_PACKAGES:-platforms;android-35 build-tools;35.0.0}
      SDK_AUTO_INSTALL: ${SDK_AUTO_INSTALL:-true}
      AAPT2_MODE: ${AAPT2_MODE:-auto}
      AAPT2_BINARY: ${AAPT2_BINARY:-}
      GRADLE_JVM_ARGS: ${GRADLE_JVM_ARGS:--Xmx4096m -XX:+UseG1GC -Dfile.encoding=UTF-8}
      KOTLIN_DAEMON_JVM_ARGS: ${KOTLIN_DAEMON_JVM_ARGS:--Xmx3072m}
      GRADLE_MAX_WORKERS: ${GRADLE_MAX_WORKERS:-3}
      BUILD_TIMEOUT_MIN: ${BUILD_TIMEOUT_MIN:-45}
      MAX_BUILD_HISTORY: ${MAX_BUILD_HISTORY:-30}
      NINE_ROUTER_URL: ${NINE_ROUTER_URL:-http://127.0.0.1:20128/v1}
      NINE_ROUTER_API_KEY: ${NINE_ROUTER_API_KEY:-}
      NINE_ROUTER_MODEL: ${NINE_ROUTER_MODEL:-auto}
      HERMES_WEBHOOK_URL: ${HERMES_WEBHOOK_URL:-http://127.0.0.1:8644/webhook}
      HERMES_WEBHOOK_SECRET: ${HERMES_WEBHOOK_SECRET:-}
    volumes:
      - android-sdk:/opt/android-sdk        # SDK + recorded aapt2 path
      - gradle-home:/root/.gradle           # dependency + build cache
      - android-keys:/root/.android         # ADB RSA keys: phone stays authorized across redeploys
      - runner-data:/data                   # build history, logs, APK artifacts, session secret
      - project:/workspace                  # Android project checkout

volumes:
  android-sdk:
  gradle-home:
  android-keys:
  runner-data:
  project:
