name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly: catches breakage from new AGP / Gradle / Kotlin releases

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit + integration tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: runner
      - name: Lint shell scripts
        run: shellcheck -S warning runner/scripts/*.sh .github/ci/*.sh
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config -q
      - name: Template Gradle wrapper matches the official checksum
        run: |
          v=$(node -p "require('./runner/templates/versions.json').gradle")
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$v-wrapper.jar.sha256")
          have=$(sha256sum runner/templates/wrapper/gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          echo "gradle $v wrapper: want $want have $have"; [ "$want" = "$have" ]
      - name: Editor bundle is committed
        run: test -s runner/public/vendor/codemirror.bundle.js

  ui:
    name: Dashboard in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (CI only, the runner itself has no dependencies)
        working-directory: runner
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Build the editor bundle from editor/src (the smoke test runs the current source)
        working-directory: editor
        run: npm ci --no-audit --no-fund && npm run build
      - name: Browser smoke test
        working-directory: runner
        env:
          UI_OUT: ${{ runner.temp }}/ui
        run: node test/ui/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/ui
          retention-days: 14

  docker-arm64:
    name: Docker on arm64 (${{ matrix.stack }})
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stack: [agp8, latest]
    env:
      AUTH_PASSWORD: ci-password-123456
      DEFAULT_PACKAGE_NAME: dev.runner.sample
      SAMPLE_DIR: ${{ github.workspace }}/../sample
      KEYSTORE_DIR: ${{ github.workspace }}/../keys
      RELEASE_KEYSTORE_PATH: /keys/ci.jks
      RELEASE_KEYSTORE_PASSWORD: ci-store-pass
      RELEASE_KEY_ALIAS: ci
      # latest: only build-tools; AGP downloads the compileSdk platform itself (licenses are pre-accepted)
      SDK_PACKAGES: ${{ matrix.stack == 'agp8' && 'platforms;android-35 build-tools;35.0.0' || 'build-tools;36.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate sample Compose project + release keystore
        run: |
          .github/ci/make-sample-project.sh "$SAMPLE_DIR" "${{ matrix.stack }}" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair -keystore "$KEYSTORE_DIR/ci.jks" -storepass ci-store-pass -keypass ci-store-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 -dname "CN=RunnerCI"
      - name: Build image and start (runner + edge)
        run: docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml up -d --build
      - name: End-to-end through the API
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          E2E_TEMPLATES: ${{ matrix.stack == 'latest' && '1' || '0' }}
        run: .github/ci/e2e.sh http://127.0.0.1:3080 "$AUTH_PASSWORD" dev.runner.sample
      - name: Verify APKs with SDK tools inside the container
        run: |
          docker compose cp "${{ runner.temp }}/e2e/debug.apk" runner:/tmp/debug.apk
          docker compose cp "${{ runner.temp }}/e2e/release.apk" runner:/tmp/release.apk
          docker compose exec -T runner bash /ci/verify-apk.sh /tmp/debug.apk dev.runner.sample
          docker compose exec -T runner bash /ci/verify-apk.sh /tmp/release.apk dev.runner.sample RunnerCI
          if [ -f "${{ runner.temp }}/e2e/template-compose.apk" ]; then
            for t in compose views webview; do
              docker compose cp "${{ runner.temp }}/e2e/template-$t.apk" runner:/tmp/template-$t.apk
              docker compose exec -T runner bash /ci/verify-apk.sh /tmp/template-$t.apk dev.ci.$t
            done
            docker compose cp "${{ runner.temp }}/e2e/template-compose.aab" runner:/tmp/template.aab
            docker compose exec -T runner sh -c 'jarsigner -verify /tmp/template.aab | tail -n 2 && jarsigner -verify -verbose -certs /tmp/template.aab | grep -m1 "CN=Vendroid CI"'
          fi
      - name: Edge relay serves the dashboard
        run: |
          docker compose exec -T edge node -e "
            fetch('http://127.0.0.1:3080/healthz').then(async r => { if (!r.ok) process.exit(1); console.log('healthz', await r.text()); })
            .then(() => fetch('http://127.0.0.1:3080/')).then(async r => { const t = await r.text(); if (!t.includes('Sign in')) process.exit(1); console.log('login page OK'); })
            .catch(e => { console.error(e); process.exit(1); })"
      - name: Persistence across redeploy
        run: |
          docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml down
          docker compose -f docker-compose.yml -f .github/ci/compose.ci.yml up -d
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3080/healthz && break; sleep 2; done
          curl -fsS -c j -H 'Content-Type: application/json' -d "{\"password\":\"$AUTH_PASSWORD\"}" http://127.0.0.1:3080/api/auth/login
          n=$(curl -fsS -b j http://127.0.0.1:3080/api/builds | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).builds.length))')
          echo "builds after redeploy: $n"; [ "$n" -ge 3 ]
          p=$(curl -fsS -b j http://127.0.0.1:3080/api/projects | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).projects.map(p=>p.id).join(",")))')
          echo "projects after redeploy: $p"; echo "$p" | grep -q android-project
          docker compose exec -T runner test -s /root/.android/adbkey && echo "ADB key persisted"
      - name: Logs
        if: always()
        run: |
          docker compose logs --no-color --tail=300 > "${{ runner.temp }}/compose.log" || true
          tail -n 120 "${{ runner.temp }}/compose.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-arm64-${{ matrix.stack }}
          path: |
            ${{ runner.temp }}/e2e
            ${{ runner.temp }}/compose.log
          retention-days: 7

  systemd-arm64:
    name: Direct install (systemd) on arm64
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate sample project as a git remote
        run: |
          .github/ci/make-sample-project.sh /tmp/sample agp8
          git clone -q --bare /tmp/sample /tmp/sample.git
          chmod -R a+rX /tmp/sample.git
      - name: Run setup script
        run: sudo PROJECT_GIT_URL=file:///tmp/sample.git bash runner/scripts/setup-ubuntu-arm64.sh
      - name: Configure signing + package
        run: |
          sudo keytool -genkeypair -keystore /var/lib/android-runner/ci.jks -storepass ci-store-pass -keypass ci-store-pass \
            -alias ci -keyalg RSA -keysize 2048 -validity 365 -dname "CN=RunnerCI"
          sudo chown android-runner: /var/lib/android-runner/ci.jks
          sudo sed -i -e 's|^DEFAULT_PACKAGE_NAME=.*|DEFAULT_PACKAGE_NAME=dev.runner.sample|' \
            -e 's|^RELEASE_KEYSTORE_PATH=.*|RELEASE_KEYSTORE_PATH=/var/lib/android-runner/ci.jks|' \
            -e 's|^RELEASE_KEYSTORE_PASSWORD=.*|RELEASE_KEYSTORE_PASSWORD=ci-store-pass|' \
            -e 's|^RELEASE_KEY_ALIAS=.*|RELEASE_KEY_ALIAS=ci|' /etc/android-runner.env
          sudo systemctl restart android-runner
      - name: End-to-end through the API
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
        run: |
          PW="$(sudo sed -n 's/^AUTH_PASSWORD=//p' /etc/android-runner.env)"
          E2E_TEMPLATES=1 .github/ci/e2e.sh http://127.0.0.1:3080 "$PW" dev.runner.sample
      - name: Verify APKs
        run: |
          install -m 644 "${{ runner.temp }}/e2e/release.apk" /tmp/release.apk
          install -m 644 .github/ci/verify-apk.sh /tmp/verify-apk.sh
          sudo -u android-runner env ANDROID_HOME=/opt/android-sdk JAVA_HOME=/usr/lib/jvm/java-17-openjdk-arm64 \
            PATH=/usr/lib/jvm/java-17-openjdk-arm64/bin:/usr/bin:/bin bash /tmp/verify-apk.sh /tmp/release.apk dev.runner.sample RunnerCI
      - name: Service logs
        if: always()
        run: sudo journalctl -u android-runner --no-pager -n 200
